services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: pointrush
      POSTGRES_PASSWORD: pointrush_local
      POSTGRES_DB: pointrush
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pointrush -d pointrush']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
