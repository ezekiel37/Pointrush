# Builds the API image on Google Cloud Build (no local Docker needed):
#   gcloud builds submit --config apps/api/cloudbuild.yaml \
#     --substitutions=_IMAGE=REGION-docker.pkg.dev/PROJECT/acticlaim/api:TAG .
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'apps/api/Dockerfile', '-t', '${_IMAGE}', '.']
images: ['${_IMAGE}']
